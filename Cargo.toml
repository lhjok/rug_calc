[package]
name = "rug_calc"
version = "0.1.14"
edition = "2021"
description = "A Rug-powered scientific computing engine featuring high-performance, arbitrary-precision numerical evaluation."
repository = "https://github.com/lhjok/rug_calc"
keywords = ["calculator", "math", "arbitrary-precision", "scientific", "high-performance"]
categories = ["science", "mathematics", "parser-implementations"]
license = "MIT"

[dependencies.phf]
version = "0.14.0"
features = ["macros"]

[dependencies.rug]
version = "1.30.0"
default-features = false
features = ["std", "float"]
